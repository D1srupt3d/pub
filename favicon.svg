    </filter>
  </defs>
  <rect width="32" height="32" rx="6" fill="#0a0805"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" fill="none" stroke="#3a2a10"/>
  <text x="16" y="22" font-family="ui-monospace, Menlo, monospace" font-weight="bold" font-size="14" fill="#ffb000" text-anchor="middle" filter="url(#glow)">D1</text>
</svg>
